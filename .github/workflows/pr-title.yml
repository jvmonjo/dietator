name: Lint PR Title

# Releases are driven by semantic-release reading Conventional Commit messages.
# This check fails a PR whose title is not a valid Conventional Commit, so that
# squash-merges (which use the PR title as the commit message) always produce a
# release-worthy commit and a feature can't silently skip a release.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed Conventional Commit types (kept in sync with semantic-release).
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
